<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0D9"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA8232"/>
      <stop offset="100%" stop-color="#E8CE8A"/>
    </linearGradient>

    <!-- Wine/Rose Accent Gradient -->
    <linearGradient id="roseRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC4CC"/>
      <stop offset="45%" stop-color="#A25B69"/>
      <stop offset="100%" stop-color="#6B1D2F"/>
    </linearGradient>

    <!-- Diamond Gemstone Gradient -->
    <linearGradient id="gemGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E8F4FF"/>
      <stop offset="100%" stop-color="#A8D0FA"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#2D1117" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#ringShadow)">
    <!-- Left Wedding Ring (Gold) -->
    <circle cx="25" cy="37" r="16" stroke="url(#goldRing)" stroke-width="4.5" fill="none"/>

    <!-- Right Intertwined Ring (Rose/Wine) -->
    <circle cx="39" cy="37" r="16" stroke="url(#roseRing)" stroke-width="4.5" fill="none"/>

    <!-- Interlocking overlap segment for authentic interlock effect -->
    <path d="M25 21 A16 16 0 0 1 41 37" stroke="url(#goldRing)" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Diamond Setting Base -->
    <path d="M39 13 L44 20 L34 20 Z" fill="url(#goldRing)"/>

    <!-- Diamond Faceted Gemstone -->
    <polygon points="39,9 44.5,15 39,20 33.5,15" fill="url(#gemGlow)" stroke="#FFFFFF" stroke-width="0.8"/>
    <polygon points="39,9 41.8,15 39,20 36.2,15" fill="#FFFFFF" opacity="0.65"/>

    <!-- Diamond Sparkle 4-point Glint -->
    <path d="M39 4 L40.2 7.5 L44 8.7 L40.2 9.9 L39 13.5 L37.8 9.9 L34 8.7 L37.8 7.5 Z" fill="#FFFFFF"/>
    <circle cx="39" cy="8.7" r="1" fill="#FFFFFF"/>
  </g>
</svg>
